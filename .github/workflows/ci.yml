name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check shared environment
        run: uv run --no-project --python 3.13.15 scripts/dev.py check all

  module:
    name: module (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: abc2lab-contracts
            module: contracts
          - package: abc2lab-evidence
            module: evidence
          - package: abc2lab-gateway
            module: gateway
          - package: abc2lab-host
            module: host
          - package: abc2lab-judge
            module: judge
          - package: abc2lab-knowledge
            module: knowledge
          - package: abc2lab-mcp-knowledge
            module: mcp-knowledge
          - package: abc2lab-mcp-webdiag
            module: mcp-webdiag
          - package: abc2lab-policy
            module: policy
          - package: abc2lab-reasoner
            module: reasoner
          - package: abc2lab-report
            module: report
          - package: abc2lab-webdiag
            module: webdiag
          - package: abc2lab-app
            module: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Check selected module in isolation
        run: uv run --no-project --python 3.13.15 scripts/dev.py check "${{ matrix.module }}"
