[project]
name = "abc2lab-report"
version = "0.1.0"
description = "ABC2LAB report package"
requires-python = ">=3.13,<3.14"
dependencies = [
    "abc2lab-contracts",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.3,<3.4"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
